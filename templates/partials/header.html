<header class="app-header">
  <div class="app-header__container">
    <a href="{% url 'pages:home' %}">
      <h1 class="app-header__title">Christofer Saputra</h1>
    </a>
    <nav class="app-header__buttons">
      <a href="{% url 'pages:projects' %}" class="app-header__link{% if request.resolver_match.view_name == 'pages:projects' %} app-header__link--active{% endif %}">Projects</a>
      <a href="{% url 'blogs:list' %}" class="app-header__link{% if request.resolver_match.namespace == 'blogs' %} app-header__link--active{% endif %}">Blog</a>
      <a href="{% url 'pages:tools' %}" class="app-header__link{% if request.resolver_match.view_name == 'pages:tools' %} app-header__link--active{% endif %}">Tools</a>
      <a href="{% url 'pages:about' %}" class="app-header__link{% if request.resolver_match.view_name == 'pages:about' %} app-header__link--active{% endif %}">About</a>
      <label class="theme-toggle">
        <input type="checkbox" class="theme-toggle__input" aria-label="Toggle dark mode">
        <span class="theme-toggle__handle"></span>
        <span class="theme-toggle__icon theme-toggle__icon--sun"></span>
        <span class="theme-toggle__icon theme-toggle__icon--moon"></span>
      </label>
    </nav>
  </div>
</header>
